[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo_mysql", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.curl", "php83Extensions.tokenizer", "composer"]

[phases.install]
cmds = ["composer install --no-dev --no-interaction --optimize-autoloader"]

[phases.build]
cmds = [
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan storage:link"
]

[start]
cmd = "php artisan migrate --force && php -S 0.0.0.0:${PORT:-8080} -t public"
